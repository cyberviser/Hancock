name: Hancock Static Assessor CI

on:
  pull_request:
    branches: [main]
    paths:
      - "hancock_static_assessor.py"
      - "tests/test_hancock_static_assessor.py"
      - "docs/LOCAL_STATIC_ASSESSMENT.md"
      - ".github/workflows/static-assessor.yml"
  push:
    branches: [main]
    paths:
      - "hancock_static_assessor.py"
      - "tests/test_hancock_static_assessor.py"
      - "docs/LOCAL_STATIC_ASSESSMENT.md"
      - ".github/workflows/static-assessor.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  static-assessor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_hancock_static_assessor.py
      - name: Generate static assessor smoke report
        run: python hancock_static_assessor.py . --format json > static-assessor-report.json
      - name: Show smoke report summary
        run: python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('static-assessor-report.json').read_text())
          print('highest_severity=', report.get('highest_severity'))
          print('findings=', len(report.get('findings', [])))
          print('analyzed_files=', report.get('inventory', {}).get('analyzed_files'))
          PY
