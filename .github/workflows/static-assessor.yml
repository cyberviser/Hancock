name: Hancock Static Assessor CI

on:
  pull_request:
    branches: [main]
    paths:
      - "hancock_static_assessor.py"
      - "tests/test_hancock_static_assessor.py"
      - "docs/LOCAL_STATIC_ASSESSMENT.md"
      - ".github/workflows/static-assessor.yml"
  push:
    branches: [main]
    paths:
      - "hancock_static_assessor.py"
      - "tests/test_hancock_static_assessor.py"
      - "docs/LOCAL_STATIC_ASSESSMENT.md"
      - ".github/workflows/static-assessor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-assessor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_hancock_static_assessor.py
      - run: python hancock_static_assessor.py . --format json --fail-on high
